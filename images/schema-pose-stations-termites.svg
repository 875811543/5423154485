<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="schema-titre schema-desc" font-family="Inter, system-ui, sans-serif">
  <title id="schema-titre">Pose des stations de détection et de traitement contre les termites</title>
  <desc id="schema-desc">Coupe d'une habitation montrant trois dispositifs : stations de détection enterrées dans la terre autour du bâtiment, stations de surface fixées sur sol dur en zone urbaine, et stations curatives murales posées à l'intérieur le long des murs.</desc>

  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDF2FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <pattern id="terre" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#E8DFD2"/>
      <circle cx="3" cy="4" r="1.1" fill="#C9B99F"/>
      <circle cx="10" cy="9" r="1.1" fill="#C9B99F"/>
      <circle cx="7" cy="2" r="0.8" fill="#D6C8B2"/>
    </pattern>
    <pattern id="enrobe" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#9CA3AF"/>
      <circle cx="2" cy="3" r="0.9" fill="#8A919B"/>
      <circle cx="7" cy="7" r="0.9" fill="#8A919B"/>
    </pattern>
    <marker id="fleche" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#1A4DFB"/>
    </marker>
    <marker id="flecheDeb" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
      <path d="M9 0 L0 4.5 L9 9 z" fill="#1A4DFB"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="url(#ciel)"/>

  <!-- ================= TITRE ================= -->
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#0F172A">
    Pose des stations : extérieur en terre, extérieur urbain, intérieur
  </text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748B">
    Coupe schématique d'une habitation — Dezinsect Corse
  </text>

  <!-- ================= SOLS ================= -->
  <!-- terre à gauche -->
  <rect x="0" y="400" width="330" height="140" fill="url(#terre)"/>
  <!-- dalle / enrobé à droite -->
  <rect x="670" y="400" width="330" height="140" fill="url(#enrobe)"/>
  <rect x="670" y="400" width="330" height="9" fill="#6B7280"/>
  <!-- terre sous l'enrobé -->
  <rect x="670" y="470" width="330" height="70" fill="url(#terre)" opacity="0.85"/>
  <line x1="670" y1="470" x2="1000" y2="470" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ================= MAISON ================= -->
  <!-- terrain sous la maison -->
  <rect x="330" y="400" width="340" height="140" fill="url(#terre)"/>
  <!-- soubassement -->
  <rect x="330" y="392" width="340" height="18" fill="#94A3B8"/>
  <!-- murs -->
  <rect x="330" y="200" width="340" height="192" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="330" y="200" width="24" height="192" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="646" y="200" width="24" height="192" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <!-- sol intérieur -->
  <rect x="354" y="374" width="292" height="18" fill="#E7E2D8" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- toit -->
  <path d="M310 200 L500 108 L690 200 Z" fill="#1A4DFB" opacity="0.9"/>
  <path d="M310 200 L500 108 L690 200 Z" fill="none" stroke="#0F37BE" stroke-width="2"/>
  <!-- charpente -->
  <path d="M360 190 L500 122 L640 190" fill="none" stroke="#B08A5A" stroke-width="6" stroke-linecap="round"/>
  <text x="500" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">charpente</text>
  <!-- fenêtre -->
  <rect x="470" y="224" width="60" height="48" fill="#DCE9FF" stroke="#94A3B8" stroke-width="2"/>
  <line x1="500" y1="224" x2="500" y2="272" stroke="#94A3B8" stroke-width="2"/>
  <line x1="470" y1="248" x2="530" y2="248" stroke="#94A3B8" stroke-width="2"/>

  <!-- ============ 1. STATIONS ENTERRÉES (terre) ============ -->
  <g>
    <!-- trois stations enterrées -->
    <g>
      <rect x="86" y="404" width="34" height="66" rx="4" fill="#22C55E" stroke="#12AE4C" stroke-width="2.5"/>
      <rect x="94" y="416" width="18" height="44" rx="2" fill="#B08A5A"/>
      <rect x="82" y="396" width="42" height="10" rx="3" fill="#0F172A"/>
    </g>
    <g>
      <rect x="176" y="404" width="34" height="66" rx="4" fill="#22C55E" stroke="#12AE4C" stroke-width="2.5"/>
      <rect x="184" y="416" width="18" height="44" rx="2" fill="#B08A5A"/>
      <rect x="172" y="396" width="42" height="10" rx="3" fill="#0F172A"/>
    </g>
    <g>
      <rect x="266" y="404" width="34" height="66" rx="4" fill="#22C55E" stroke="#12AE4C" stroke-width="2.5"/>
      <rect x="274" y="416" width="18" height="44" rx="2" fill="#B08A5A"/>
      <rect x="262" y="396" width="42" height="10" rx="3" fill="#0F172A"/>
    </g>

    <!-- cotation entre stations -->
    <line x1="103" y1="500" x2="193" y2="500" stroke="#1A4DFB" stroke-width="1.6"
          marker-start="url(#flecheDeb)" marker-end="url(#fleche)"/>
    <text x="148" y="494" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A4DFB">espacement régulier</text>

    <!-- distance au mur -->
    <line x1="300" y1="386" x2="330" y2="386" stroke="#1A4DFB" stroke-width="1.6"
          marker-start="url(#flecheDeb)" marker-end="url(#fleche)"/>
    <text x="292" y="378" text-anchor="end" font-size="11.5" font-weight="600" fill="#1A4DFB">au pied du mur</text>

    <!-- galeries de termites -->
    <path d="M120 448 Q150 466 176 442" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M210 446 Q240 468 266 444" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M300 442 Q322 462 340 430" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- ============ 2. STATIONS DE SURFACE (urbain) ============ -->
  <g>
    <g>
      <rect x="722" y="372" width="52" height="30" rx="6" fill="#22C55E" stroke="#12AE4C" stroke-width="2.5"/>
      <rect x="736" y="380" width="24" height="14" rx="2" fill="#B08A5A"/>
      <circle cx="730" cy="404" r="2.6" fill="#0F172A"/>
      <circle cx="766" cy="404" r="2.6" fill="#0F172A"/>
    </g>
    <g>
      <rect x="828" y="372" width="52" height="30" rx="6" fill="#22C55E" stroke="#12AE4C" stroke-width="2.5"/>
      <rect x="842" y="380" width="24" height="14" rx="2" fill="#B08A5A"/>
      <circle cx="836" cy="404" r="2.6" fill="#0F172A"/>
      <circle cx="872" cy="404" r="2.6" fill="#0F172A"/>
    </g>
    <text x="801" y="428" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A4DFB">fixées sur le sol dur</text>
    <text x="801" y="524" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">béton, enrobé, terrasse</text>
    <!-- galerie remontant sous l'enrobé -->
    <path d="M690 452 Q760 500 800 470" fill="none" stroke="#C2410C" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- ============ 3. STATIONS MURALES (intérieur) ============ -->
  <g>
    <g>
      <rect x="380" y="330" width="26" height="44" rx="4" fill="#1A4DFB" stroke="#0F37BE" stroke-width="2.5"/>
      <rect x="386" y="340" width="14" height="24" rx="2" fill="#B08A5A"/>
    </g>
    <g>
      <rect x="596" y="330" width="26" height="44" rx="4" fill="#1A4DFB" stroke="#0F37BE" stroke-width="2.5"/>
      <rect x="602" y="340" width="14" height="24" rx="2" fill="#B08A5A"/>
    </g>
    <text x="500" y="356" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1A4DFB">le long des murs</text>
    <!-- cordonnet de termites le long du mur -->
    <path d="M354 392 Q368 366 380 352" fill="none" stroke="#C2410C" stroke-width="2.4"/>
    <path d="M646 392 Q634 366 622 352" fill="none" stroke="#C2410C" stroke-width="2.4"/>
  </g>

  <!-- ============ ÉTIQUETTES NUMÉROTÉES ============ -->
  <g font-size="13" font-weight="700">
    <!-- 1 -->
    <circle cx="60" cy="330" r="15" fill="#22C55E"/>
    <text x="60" y="335" text-anchor="middle" fill="#06231A">1</text>
    <text x="82" y="328" font-size="13.5" font-weight="700" fill="#0F172A">Extérieur en terre</text>
    <text x="82" y="346" font-size="11.5" font-weight="400" fill="#475569">stations de détection enterrées</text>

    <!-- 2 -->
    <circle cx="700" cy="330" r="15" fill="#22C55E"/>
    <text x="700" y="335" text-anchor="middle" fill="#06231A">2</text>
    <text x="722" y="328" font-size="13.5" font-weight="700" fill="#0F172A">Extérieur urbain</text>
    <text x="722" y="346" font-size="11.5" font-weight="400" fill="#475569">stations de surface, sol imperméable</text>

    <!-- 3 -->
    <circle cx="500" cy="292" r="15" fill="#1A4DFB"/>
    <text x="500" y="297" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="500" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">Intérieur — stations murales curatives</text>
  </g>

  <!-- ================= LÉGENDE ================= -->
  <g transform="translate(60, 610)">
    <rect x="-16" y="-22" width="900" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <rect x="4" y="-6" width="16" height="22" rx="3" fill="#22C55E" stroke="#12AE4C" stroke-width="2"/>
    <text x="30" y="10" font-size="12" fill="#334155">Station de détection (extérieur)</text>

    <rect x="250" y="-6" width="16" height="22" rx="3" fill="#1A4DFB" stroke="#0F37BE" stroke-width="2"/>
    <text x="276" y="10" font-size="12" fill="#334155">Station curative (intérieur)</text>

    <rect x="486" y="-2" width="14" height="14" rx="2" fill="#B08A5A"/>
    <text x="510" y="10" font-size="12" fill="#334155">Bois appât</text>

    <path d="M620 6 Q640 -8 660 6" fill="none" stroke="#C2410C" stroke-width="2.4" stroke-dasharray="4 4"/>
    <text x="672" y="10" font-size="12" fill="#334155">Galeries et cordonnets de termites</text>
  </g>

  <!-- note bas -->
  <text x="500" y="572" text-anchor="middle" font-size="11" fill="#64748B">
    Schéma de principe. Le nombre et l'emplacement des stations sont définis après diagnostic sur place.
  </text>
</svg>
